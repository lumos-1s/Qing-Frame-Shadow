<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="wfTitle wfDesc">
  <title id="wfTitle">清框影的四步出片流程</title>
  <desc id="wfDesc">导入照片、选边框、调色与参数、批量导出四个阶段的流程图，强调所有步骤都在本机完成。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0c1713"/>
      <stop offset="1" stop-color="#101f19"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" letter-spacing="2.4" fill="#b8a37e">
    <text x="48" y="44">HOW IT WORKS</text>
    <text x="1152" y="44" text-anchor="end" fill="#6fe3c6">ALL ON YOUR MACHINE</text>
  </g>
  <path d="M48 62H1152" stroke="#e6c384" stroke-opacity=".22"/>

  <g transform="translate(48 88)">
    <!-- 01 导入 -->
    <g>
      <rect x="0" y="0" width="240" height="176" rx="16" fill="#13251d" stroke="#e6c384" stroke-opacity=".38"/>
      <text x="20" y="30" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#e6c384">01 / IMPORT</text>
      <g transform="translate(20 52)" stroke="#e6c384" stroke-width="2" fill="none">
        <rect x="4" y="4" width="64" height="48" rx="6"/>
        <circle cx="22" cy="22" r="6"/>
        <path d="M8 46l20-16 16 12 12-10 12 14"/>
      </g>
      <text x="20" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="24" font-weight="700" fill="#f4ead8">导入照片</text>
      <text x="20" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="18" fill="#c9d6cd">单张、批量或文件夹</text>
    </g>
    <!-- 02 选边框 -->
    <g transform="translate(296 0)">
      <rect x="0" y="0" width="240" height="176" rx="16" fill="#13251d" stroke="#e6c384" stroke-opacity=".38"/>
      <text x="20" y="30" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#e6c384">02 / FRAME</text>
      <g transform="translate(20 52)" stroke="#e6c384" stroke-width="2" fill="none">
        <rect x="4" y="4" width="64" height="48" rx="4"/>
        <rect x="16" y="14" width="40" height="28" rx="2" stroke-opacity=".6"/>
        <path d="M0 22h12M60 22h12M28 0v12M28 44v12" stroke-opacity=".7"/>
      </g>
      <text x="20" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="24" font-weight="700" fill="#f4ead8">选框与排版</text>
      <text x="20" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="18" fill="#c9d6cd">悬停预览，点选即套用</text>
    </g>
    <!-- 03 调色 -->
    <g transform="translate(592 0)">
      <rect x="0" y="0" width="240" height="176" rx="16" fill="#13251d" stroke="#e6c384" stroke-opacity=".38"/>
      <text x="20" y="30" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#e6c384">03 / GRADE</text>
      <g transform="translate(20 52)" stroke="#e6c384" stroke-width="2" fill="none">
        <path d="M4 8v40M28 8v40M52 8v40"/>
        <circle cx="4" cy="26" r="5" fill="#13251d"/>
        <circle cx="28" cy="16" r="5" fill="#13251d"/>
        <circle cx="52" cy="34" r="5" fill="#13251d"/>
      </g>
      <text x="20" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="24" font-weight="700" fill="#f4ead8">调色与参数</text>
      <text x="20" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="18" fill="#c9d6cd">曲线、蒙版、EXIF、签名</text>
    </g>
    <!-- 04 导出 -->
    <g transform="translate(888 0)">
      <rect x="0" y="0" width="240" height="176" rx="16" fill="#13251d" stroke="#e6c384" stroke-opacity=".38"/>
      <text x="20" y="30" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#e6c384">04 / EXPORT</text>
      <g transform="translate(20 52)" stroke="#e6c384" stroke-width="2" fill="none">
        <rect x="4" y="16" width="48" height="36" rx="4"/>
        <rect x="14" y="8" width="48" height="36" rx="4" stroke-opacity=".55"/>
        <path d="M70 34h20m-8-8 8 8-8 8"/>
      </g>
      <text x="20" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="24" font-weight="700" fill="#f4ead8">成批出图</text>
      <text x="20" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="18" fill="#c9d6cd">PNG / JPEG / WebP</text>
    </g>
  </g>

  <!-- 连接线 -->
  <g stroke="#e6c384" stroke-opacity=".6" stroke-width="2">
    <path d="M288 176h8M584 176h8M880 176h8" stroke-linecap="round"/>
  </g>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" letter-spacing="1.2" fill="#9fb5a7">
    <text x="48" y="282">NO ACCOUNT · NO UPLOAD · NO CLOUD</text>
    <text x="1152" y="282" text-anchor="end">WINDOWS 10 / 11</text>
  </g>
</svg>
